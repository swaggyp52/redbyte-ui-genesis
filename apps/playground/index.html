    <script>
      // SAFETY: Defer Three.js preload until after main.tsx controls the import order
      // This prevents temporal dead zone (TDZ) errors in Three.js minified exports
      const params = new URLSearchParams(window.location.search);
      const isE2E = params.get('e2e') === '1' || navigator.webdriver;
      if (!params.has('boot') && !isE2E) {
        // Normal mode: Three.js will be loaded by full-bootstrap
        // Preload is safe because full-bootstrap controls import order
        document.write('<link rel="modulepreload" crossorigin href="/assets/vendor-3d-COegcR6u.js">');
      }
    </script>
    <!-- Fonts: Geist (display + body) and Geist Mono (code + data) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
