<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>React+DOM 18.2.0 CDN Test</title>
  </head>
  <body>
    <div id="root"></div>
    <script crossorigin src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
    <script>
      console.info('REACT_DOM_LOADED', window.React?.version, window.ReactDOM?.version);
      const root = window.ReactDOM.createRoot(document.getElementById('root'));
      root.render(
        window.React.createElement('div', { id: 'boot-marker', style: { padding: 16, color: '#9ae6b4' } }, 'REACT_DOM_WORKS')
      );
    </script>
  </body>
</html>
