#:schema node_modules/wrangler/config-schema.json
# Cloudflare Pages configuration for unified RedByte deploy
#
# Deployment path: GitHub Actions Direct Upload
# (.github/workflows/deploy-cloudflare.yml builds locally + uploads dist/)
# CF Pages does NOT support [build] in wrangler.toml for Pages projects.

name = "redbyte-ui-genesis"
pages_build_output_dir = "dist"
compatibility_date = "2024-01-01"
