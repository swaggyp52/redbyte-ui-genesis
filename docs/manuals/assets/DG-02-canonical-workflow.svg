<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 200" width="820" height="200" font-family="Inter, Segoe UI, Arial, sans-serif">
  <!-- Background -->
  <rect width="820" height="200" fill="#f8f9fa" rx="8"/>

  <!-- Title -->
  <text x="410" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="#1a1a2e">RedByte Canonical Workflow</text>
  <text x="410" y="44" text-anchor="middle" font-size="11" fill="#666">DG-02 · IdeMode: project | design | verify | hardware | export</text>

  <!-- Stage 1: Project -->
  <rect x="20" y="64" width="120" height="80" rx="8" fill="#6366f1" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="80" y="96" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Project</text>
  <text x="80" y="113" text-anchor="middle" font-size="10" fill="#e0e7ff">Create or open</text>
  <text x="80" y="127" text-anchor="middle" font-size="10" fill="#e0e7ff">project · select</text>
  <text x="80" y="141" text-anchor="middle" font-size="10" fill="#e0e7ff">starter example</text>

  <!-- Arrow 1→2 -->
  <line x1="140" y1="104" x2="166" y2="104" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#arrowBlue)"/>

  <!-- Stage 2: Design -->
  <rect x="166" y="64" width="120" height="80" rx="8" fill="#0ea5e9" stroke="#0284c7" stroke-width="1.5"/>
  <text x="226" y="96" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Design</text>
  <text x="226" y="113" text-anchor="middle" font-size="10" fill="#e0f2fe">Place gates</text>
  <text x="226" y="127" text-anchor="middle" font-size="10" fill="#e0f2fe">and wire the</text>
  <text x="226" y="141" text-anchor="middle" font-size="10" fill="#e0f2fe">circuit</text>

  <!-- Arrow 2→3 -->
  <line x1="286" y1="104" x2="312" y2="104" stroke="#0284c7" stroke-width="2.5" marker-end="url(#arrowCyan)"/>

  <!-- Stage 3: Verify -->
  <rect x="312" y="64" width="120" height="80" rx="8" fill="#10b981" stroke="#059669" stroke-width="1.5"/>
  <text x="372" y="96" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Verify</text>
  <text x="372" y="113" text-anchor="middle" font-size="10" fill="#d1fae5">Run truth table</text>
  <text x="372" y="127" text-anchor="middle" font-size="10" fill="#d1fae5">vectors · confirm</text>
  <text x="372" y="141" text-anchor="middle" font-size="10" fill="#d1fae5">pass/fail</text>

  <!-- Arrow 3→4 -->
  <line x1="432" y1="104" x2="458" y2="104" stroke="#059669" stroke-width="2.5" marker-end="url(#arrowGreen)"/>

  <!-- Stage 4: Hardware -->
  <rect x="458" y="64" width="120" height="80" rx="8" fill="#f59e0b" stroke="#d97706" stroke-width="1.5"/>
  <text x="518" y="96" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Hardware</text>
  <text x="518" y="113" text-anchor="middle" font-size="10" fill="#fef3c7">Map ports to</text>
  <text x="518" y="127" text-anchor="middle" font-size="10" fill="#fef3c7">Basys 3 pins</text>
  <text x="518" y="141" text-anchor="middle" font-size="10" fill="#fef3c7">(SW, LED, BTN)</text>

  <!-- Arrow 4→5 -->
  <line x1="578" y1="104" x2="604" y2="104" stroke="#d97706" stroke-width="2.5" marker-end="url(#arrowAmber)"/>

  <!-- Stage 5: Export -->
  <rect x="604" y="64" width="120" height="80" rx="8" fill="#ef4444" stroke="#dc2626" stroke-width="1.5"/>
  <text x="664" y="96" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Export</text>
  <text x="664" y="113" text-anchor="middle" font-size="10" fill="#fee2e2">Generate ZIP</text>
  <text x="664" y="127" text-anchor="middle" font-size="10" fill="#fee2e2">top.vhd, top.xdc</text>
  <text x="664" y="141" text-anchor="middle" font-size="10" fill="#fee2e2">testbench.vhd</text>

  <!-- Import note (utility surface) -->
  <rect x="724" y="64" width="76" height="80" rx="8" fill="#8b5cf6" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="762" y="96" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Import</text>
  <text x="762" y="112" text-anchor="middle" font-size="9" fill="#ede9fe">Utility</text>
  <text x="762" y="125" text-anchor="middle" font-size="9" fill="#ede9fe">surface</text>
  <text x="762" y="138" text-anchor="middle" font-size="9" fill="#ede9fe">anytime</text>

  <!-- Footnote -->
  <text x="410" y="185" text-anchor="middle" font-size="10" fill="#888">Users may navigate surfaces freely. Import is available at any stage. Source: workflowStages.ts</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#4f46e5"/>
    </marker>
    <marker id="arrowCyan" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#0284c7"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#059669"/>
    </marker>
    <marker id="arrowAmber" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#d97706"/>
    </marker>
  </defs>
</svg>
