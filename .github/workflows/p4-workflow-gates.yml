name: Phase 4 Workflow Gates (Non-Blocking)

on:
  schedule:
    - cron: '0 3 * * *'  # 3 AM UTC daily
  workflow_dispatch:  # Manual trigger

jobs:
  phase4-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm -r build

      - name: Run Phase 4 Workflow Gates
        run: |
          echo "=== Running Phase 4 deterministic workflow gates ==="
          pnpm lab:workflow-export-verify-gate
          pnpm lab:probe-sampling-gate
          pnpm hw:dryrun-program-flow-gate

      - name: Summary
        if: success()
        run: |
          echo "✅ All Phase 4 gates passed"
          echo "- Lab workflow export/verify: PASS"
          echo "- Probe sampling determinism: PASS"
          echo "- Hardware dry-run program flow: PASS"

      - name: Report Failure
        if: failure()
        run: |
          echo "❌ Phase 4 gates failed"
          echo "Review logs above for details"
          exit 1
