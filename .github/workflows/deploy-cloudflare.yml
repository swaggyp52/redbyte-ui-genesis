# Cloudflare Pages Deployment
#
# Deploys to redbyteapps.dev when:
# - Manually triggered via workflow_dispatch, OR
# - Pushed to main AND secrets are configured
# Uses Cloudflare Pages Direct Upload API for full control over build process.

name: Deploy to Cloudflare Pages

on:
  workflow_dispatch:  # Manual trigger only (keep clean during dev)

jobs:
  deploy:
    name: Build and Deploy to CF Pages
    runs-on: ubuntu-latest
    # Only deploy on main branch or manual trigger with secrets present
    if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || github.event_name == 'workflow_dispatch' && secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != ''
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.24.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.13.0'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build playground app
        run: pnpm -w build
        env:
          GIT_SHA: ${{ github.sha }}

      - name: Publish to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: redbyte-ui-genesis
          directory: apps/playground/dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          branch: main
