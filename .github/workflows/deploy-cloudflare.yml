# Cloudflare Pages Deployment - Unified RedByte site
#
# Deploys unified dist/ output (root site + /os app) to redbyteapps.dev when:
# - Pushed to main branch
# Uses Cloudflare Pages Direct Upload API for full control over build process.

name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Build unified site and deploy to CF Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Check Cloudflare secrets
        id: cf_secrets
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "${CF_API_TOKEN}" ] && [ -n "${CF_ACCOUNT_ID}" ]; then
            echo "has_secrets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_secrets=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare secrets missing; deployment steps will be skipped."
          fi

      - name: Checkout code
        if: steps.cf_secrets.outputs.has_secrets == 'true'
        uses: actions/checkout@v4

      - name: Setup pnpm
        if: steps.cf_secrets.outputs.has_secrets == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 10.24.0

      - name: Setup Node.js
        if: steps.cf_secrets.outputs.has_secrets == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24.13.0'
          cache: 'pnpm'

      - name: Install dependencies
        if: steps.cf_secrets.outputs.has_secrets == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build unified deploy bundle
        if: steps.cf_secrets.outputs.has_secrets == 'true'
        run: pnpm -s build:unified
        env:
          VITE_APP_ENV: production
          GIT_SHA: ${{ github.sha }}

      - name: Deploy to Cloudflare Pages (Production)
        if: steps.cf_secrets.outputs.has_secrets == 'true'
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: redbyte-ui-genesis
          directory: dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          branch: main

      - name: Verify deployed SHA
        if: steps.cf_secrets.outputs.has_secrets == 'true'
        env:
          EXPECTED_SHA: ${{ github.sha }}
          VERSION_URL: https://redbyteapps.dev/os/version.json
        run: |
          set -euo pipefail
          echo "Checking deployed version at ${VERSION_URL}"
          for i in {1..18}; do
            payload="$(curl -fsSL "${VERSION_URL}" || true)"
            if [ -n "${payload}" ]; then
              deployed_sha="$(node -e "const data=JSON.parse(process.argv[1]); process.stdout.write(data.sha || '')" "${payload}")"
              echo "Attempt ${i}: deployed sha=${deployed_sha}"
              if [ "${deployed_sha}" = "${EXPECTED_SHA}" ]; then
                echo "✅ Deployed SHA matches triggering commit"
                exit 0
              fi
            else
              echo "Attempt ${i}: version payload unavailable"
            fi
            sleep 10
          done
          echo "❌ Deployment verification failed: expected ${EXPECTED_SHA} at ${VERSION_URL}"
          exit 1

      - name: Skip deploy summary
        if: steps.cf_secrets.outputs.has_secrets != 'true'
        run: echo "Skipping deploy and SHA verification because Cloudflare secrets are not configured."
