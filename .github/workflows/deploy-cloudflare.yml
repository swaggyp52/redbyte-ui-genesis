# Cloudflare Pages Deployment - Unified RedByte site
#
# Deploys unified dist/ output (root site + /os app) to redbyteapps.dev when:
# - Pushed to main branch
# Uses Cloudflare Pages Direct Upload API for full control over build process.

name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Build unified site and deploy to CF Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.24.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.13.0'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build unified deploy bundle
        run: pnpm -s build:unified
        env:
          VITE_APP_ENV: production
          GIT_SHA: ${{ github.sha }}

      - name: Deploy to Cloudflare Pages (Production)
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: redbyte-ui-genesis
          directory: dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          branch: main
          productionBranch: main
