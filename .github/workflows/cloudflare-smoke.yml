name: cloudflare-smoke

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  pages-like-build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 20.19.0
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0

      - name: Enable pnpm via corepack
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@10.24.0 --activate
          pnpm -v

      - name: Simulate zip install (remove .git)
        shell: pwsh
        run: |
          if (Test-Path ".git") { Remove-Item -Recurse -Force ".git" }

      - name: Install and build (Cloudflare parity)
        shell: pwsh
        run: pnpm ci:parity:pages

      - name: Capture build log
        if: failure()
        shell: pwsh
        run: |
          pnpm -r build *>&1 | Tee-Object -FilePath build.log
          exit 1

      - name: Upload build log artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
