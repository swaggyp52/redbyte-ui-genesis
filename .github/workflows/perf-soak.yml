# Perf Soak - Manual-only workflow
name: Perf Soak

on:
  workflow_dispatch:

jobs:
  perf-soak:
    name: Perf Soak (Manual)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.24.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run perf soak
        env:
          PERF_SOAK_TICKS: 60000
          PERF_SOAK_REPORT_EVERY: 5000
          PERF_SOAK_EXAMPLE: packages/rb-apps/src/examples/01_wire-lamp.json
        run: |
          set -o pipefail
          pnpm perf:soak | tee perf-soak.log

      - name: Upload perf soak log
        uses: actions/upload-artifact@v4
        with:
          name: perf-soak-log
          path: perf-soak.log
