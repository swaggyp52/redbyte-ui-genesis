name: Nightly Heavy Suites

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

concurrency:
  group: nightly-heavy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.24.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: pnpm

      - name: Install dependencies and verify
        run: pnpm ci:parity

      - name: Verify Unified Artifact
        run: node scripts/merge-dist.mjs && node scripts/verify-dist.mjs

  ide-screenshot-baselines:
    name: IDE Screenshot Baselines (optional)
    if: ${{ github.event_name == 'workflow_dispatch' || vars.SCREENSHOT_STRICT == '1' }}
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.24.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run IDE screenshot baselines (strict)
        env:
          SCREENSHOT_STRICT: '1'
        run: pnpm -s ide:gate:screenshots

  cloudflare-parity:
    name: Cloudflare Parity Build
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 20.19.0
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0

      - name: Enable pnpm via corepack
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@10.24.0 --activate
          pnpm -v

      - name: Simulate zip install (remove .git)
        shell: pwsh
        run: |
          if (Test-Path ".git") { Remove-Item -Recurse -Force ".git" }

      - name: Install dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Install and build (Cloudflare parity)
        shell: pwsh
        run: pnpm ci:parity:pages

  smoke-zip-install:
    name: Smoke Zip Install
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Simulate Zip Download (Remove .git)
        shell: pwsh
        run: |
          Remove-Item -Path .git -Recurse -Force
          Write-Host "Removed .git directory to simulate raw zip download."

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0

      - name: Install pnpm
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@10.24.0 --activate

      - name: Install Dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Build Workspace
        shell: pwsh
        env:
          CI: true
        run: pnpm -r build

  fpga-proof:
    name: FPGA Bridge Proof
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.24.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create proof directory
        run: mkdir -p ops/proof

      - name: Run FPGA Bridge Proof
        env:
          RB_FPGA_HMAC_SECRET: ci-test-secret-do-not-use-in-production
        run: pnpm --filter @redbyte/fpga-bridge proof:run

      - name: Verify proof artifacts
        env:
          RB_FPGA_HMAC_SECRET: ci-test-secret-do-not-use-in-production
        run: |
          if [ -f ops/proof/fpga-proof-*.json ]; then
            node packages/rb-fpga-bridge/scripts/proof-verify.js ops/proof/fpga-proof-*.json
          else
            echo "No proof artifacts found" && exit 1
          fi

  phase4-gates:
    name: Phase 4 Workflow Gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.24.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm -r build

      - name: Run Phase 4 deterministic workflow gates
        run: |
          pnpm lab:workflow-export-verify-gate
          pnpm lab:probe-sampling-gate
          pnpm hw:dryrun-program-flow-gate

  p1d-smoke:
    name: P1D End-to-End Smoke
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: pnpm

      - name: Enable pnpm via corepack
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@10.24.0 --activate
          pnpm -v

      - name: Install dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        shell: pwsh
        env:
          CI: true
        run: pnpm -r build

      - name: P1D scripted smoke gates
        shell: pwsh
        env:
          CI: true
        run: |
          pnpm -s ops:student-export-fixture-test
          pnpm -s ops:diff-gate
          pnpm -s rbx:evidence-determinism-gate
          pnpm -s rbproj:roundtrip-gate

  perf-soak:
    name: Perf Soak (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.24.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run perf soak
        env:
          PERF_SOAK_TICKS: 60000
          PERF_SOAK_REPORT_EVERY: 5000
          PERF_SOAK_EXAMPLE: packages/rb-apps/src/examples/01_wire-lamp.json
        run: |
          set -o pipefail
          pnpm perf:soak | tee perf-soak.log

      - name: Upload perf soak log
        uses: actions/upload-artifact@v4
        with:
          name: perf-soak-log
          path: perf-soak.log

  fpga-ui-smoke:
    name: FPGA UI Smoke (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.24.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Build UI
        run: pnpm -w build

      - name: Start FPGA Bridge (background)
        env:
          RB_FPGA_MOCK: '1'
          RB_FPGA_HMAC_SECRET: ci-test-secret
        run: |
          cd packages/rb-fpga-bridge
          node src/index.js > /tmp/bridge.log 2>&1 &
          echo $! > /tmp/bridge.pid
          sleep 3
          curl -f http://localhost:4242/api/health || (cat /tmp/bridge.log && exit 1)

      - name: Run Playwright Hardware Panel test
        run: pnpm exec playwright test --project=chromium --grep="Hardware Panel"

      - name: Stop FPGA Bridge
        if: always()
        run: |
          if [ -f /tmp/bridge.pid ]; then
            kill $(cat /tmp/bridge.pid) || true
          fi
