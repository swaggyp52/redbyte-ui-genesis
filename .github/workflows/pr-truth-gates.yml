name: Classroom Truth Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pr-truth-gates-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  truth-gates:
    name: Classroom Truth Gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.24.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: pnpm

      - name: Configure pnpm script policy
        run: |
          pnpm config set enable-pre-post-scripts true
          pnpm config set ignore-scripts false
          echo "ignore-scripts=$(pnpm config get ignore-scripts)"
          echo "enable-pre-post-scripts=$(pnpm config get enable-pre-post-scripts)"

      - name: Install dependencies
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile 2>&1 | tee pnpm-install.log
          if grep -qi "Ignored build scripts" pnpm-install.log; then
            echo "::error::pnpm ignored build scripts in CI. Check pnpm policy (onlyBuiltDependencies/approval) for esbuild/core-js."
            exit 1
          fi

      - name: Verify classroom truth gate
        run: pnpm -s verify:gates:classroom

      - name: Build unified artifact
        run: pnpm -s build:unified
