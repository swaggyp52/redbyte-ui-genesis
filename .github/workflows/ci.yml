# CI Workflow - DEPRECATED in favor of quality.yml
#
# This workflow is disabled. Use quality.yml instead.
# Kept for reference only.

name: CI (DISABLED)

on:
  workflow_dispatch:  # Manual trigger only

jobs:
  test:
    name: Test Suite (Zero Warnings)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.24.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install ripgrep (selector tripwire dependency)
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps

      - name: Selector tripwire (React #185 prevention)
        run: pnpm run lint:selectors

      - name: Smoke tests (Logic Playground - perspective switch)
        run: pnpm test:smoke:ci

      - name: Run tests
        run: pnpm test

      - name: Run typecheck
        run: pnpm typecheck

      - name: Run lint
        run: pnpm lint

  build:
    name: Build All Packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.24.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm -r build
