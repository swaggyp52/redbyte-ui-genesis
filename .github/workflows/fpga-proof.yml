name: FPGA Bridge Proof

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  proof:
    name: FPGA Bridge Autonomous Proof
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.24.0'

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create proof directory
        run: mkdir -p ops/proof

      - name: Run FPGA Bridge Proof
        env:
          RB_FPGA_HMAC_SECRET: ci-test-secret-do-not-use-in-production
        run: pnpm --filter @redbyte/fpga-bridge proof:run

      - name: Verify proof artifacts
        env:
          RB_FPGA_HMAC_SECRET: ci-test-secret-do-not-use-in-production
        run: |
          if [ -f ops/proof/fpga-proof-*.json ]; then
            node packages/rb-fpga-bridge/scripts/proof-verify.js ops/proof/fpga-proof-*.json
          else
            echo "No proof artifacts found" && exit 1
          fi

      - name: Replay proof events
        env:
          RB_FPGA_HMAC_SECRET: ci-test-secret-do-not-use-in-production
        run: |
          if [ -f ops/proof/fpga-proof-*.json ]; then
            pnpm --filter @redbyte/fpga-bridge proof:replay ops/proof/fpga-proof-*.json
          else
            echo "No proof found for replay" && exit 1
          fi

      - name: Upload proof artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fpga-proof-artifacts
          path: |
            ops/proof/fpga-proof-*.json
            ops/proof/fpga-proof-*.txt
            ops/proof/fpga-events-*.ndjson
            ops/proof/artifact-index-*.txt
            ops/proof/proof-replay-*.md
            ops/proof/proof-replay-*.json
          retention-days: 30

      - name: Proof Summary
        if: always()
        run: |
          echo "## FPGA Bridge Proof Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f ops/proof/fpga-proof-*.txt ]; then
            echo "✅ Proof artifacts generated successfully" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Latest Proof Log" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -20 ops/proof/fpga-proof-*.txt 2>/dev/null || echo "No log found" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ No proof artifacts found" >> $GITHUB_STEP_SUMMARY
          fi
