name: FPGA UI Smoke Test

on:
  workflow_dispatch:  # Manual trigger only (Playwright is heavy)

jobs:
  ui-smoke:
    name: Hardware Panel UI Screenshot
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.13.0'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.24.0'

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Build UI
        run: pnpm -w build

      - name: Start FPGA Bridge (background)
        env:
          RB_FPGA_MOCK: "1"
          RB_FPGA_HMAC_SECRET: ci-test-secret
        run: |
          cd packages/rb-fpga-bridge
          node src/index.js > /tmp/bridge.log 2>&1 &
          echo $! > /tmp/bridge.pid
          sleep 3
          curl -f http://localhost:4242/api/health || (cat /tmp/bridge.log && exit 1)

      - name: Run Playwright Hardware Panel test
        run: pnpm exec playwright test --project=chromium --grep="Hardware Panel"

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-fpga-ui
          path: |
            playwright-report/
            test-results/
          retention-days: 30

      - name: Stop FPGA Bridge
        if: always()
        run: |
          if [ -f /tmp/bridge.pid ]; then
            kill $(cat /tmp/bridge.pid) || true
          fi
